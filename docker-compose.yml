services:
  orchestrator:
    build:
      context: .
      dockerfile: Service/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # config.yaml holds real secrets - mounted at runtime, never baked into the image.
      - ./Service/config.yaml:/app/config.yaml
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # OTLP endpoint/protocol are supplied only via env vars, never hardcoded in source/config -
      # the OpenTelemetry SDK's AddOtlpExporter() reads these natively.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector:0.117.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI
    # Jaeger's own OTLP receiver (4317/4318 inside the container) is intentionally NOT published
    # to the host - it is reached only via the collector, over the compose network, to avoid a
    # port clash with the collector's own 4317/4318.
